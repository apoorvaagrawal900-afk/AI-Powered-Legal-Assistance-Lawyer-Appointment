{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">✏️ Edit Your Profile</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Specialization -->
                    <div class="mb-3">
                        <label class="form-label">Specialization *</label>
                        <select name="specialization" class="form-select" required>
                            <option value="">Select Specialization</option>
                            <option value="Property" {{ 'selected' if lawyer.specialization == 'Property' }}>Property Law</option>
                            <option value="Employment" {{ 'selected' if lawyer.specialization == 'Employment' }}>Employment Law</option>
                            <option value="Family" {{ 'selected' if lawyer.specialization == 'Family' }}>Family Law</option>
                            <option value="Criminal" {{ 'selected' if lawyer.specialization == 'Criminal' }}>Criminal Law</option>
                            <option value="Consumer" {{ 'selected' if lawyer.specialization == 'Consumer' }}>Consumer Law</option>
                            <option value="Corporate" {{ 'selected' if lawyer.specialization == 'Corporate' }}>Corporate Law</option>
                        </select>
                        <small class="text-muted">Select your primary area of practice</small>
                    </div>
                    
                    <!-- Experience -->
                    <div class="mb-3">
                        <label class="form-label">Experience (Years) *</label>
                        <input type="number" name="experience_years" class="form-control" value="{{ lawyer.experience_years or 0 }}" min="0" max="50" required>
                        <small class="text-muted">Years of practice experience</small>
                    </div>
                    
                    <!-- Fees --> 
                    <div class="mb-3">
                        <label class="form-label">Consultation Fees (₹) *</label>
                        <input type="number" name="fees" class="form-control" value="{{ lawyer.fees or 0 }}" min="0" step="100" required>
                        <small class="text-muted">Per session consultation fee</small>
                    </div>
                    
                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" name="phone" class="form-control" value="{{ lawyer.phone }}" placeholder="+91 XXXXX XXXXX" required>
                    </div>
                    
                    <!-- Location -->
                    <div class="mb-3">
                        <label class="form-label">Location (City) *</label>
                        <input type="text" name="location" class="form-control" value="{{ lawyer.location }}" placeholder="e.g., Delhi, Mumbai" required>
                    </div>
                    
                    <!-- Bio -->
                    <div class="mb-3">
                        <label class="form-label">About/Bio</label>
                        <textarea name="bio" class="form-control" rows="5" placeholder="Write about your experience, qualifications, and areas of expertise...">{{ lawyer.bio }}</textarea>
                        <small class="text-muted">Brief description about yourself (optional)</small>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="d-grid gap-2 d-md-block">
                        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                        <a href="{{ url_for('lawyer_dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
