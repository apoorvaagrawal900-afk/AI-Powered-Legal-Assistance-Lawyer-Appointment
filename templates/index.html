{% extends "base.html" %}
{% block title %}Home - LexAI{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1>⚖️ Welcome to LexAI</h1>
    <p class="lead">AI-Powered Legal Assistance Platform</p>

    {% if not current_user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{{ url_for('register') }}">Get Started</a>
    {% else %}
        <p class="text-success">You are logged in!</p>
    {% endif %}
</div>
{% endblock %}
