{% extends "base.html" %}

{% block title %}Book Appointment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📅 Book Appointment</h4>
            </div>
            <div class="card-body">
                <h5>{{ lawyer.name }}</h5>
                <p class="text-muted">
                    {{ lawyer.specialization }} | {{ lawyer.experience_years }} years | ₹{{ lawyer.fees }}
                </p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" required min="{{ today }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Time *</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Reason *</label>
                        <textarea name="reason" class="form-control" rows="4" placeholder="Describe your legal issue..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-success">📅 Book Appointment</button>
                    <a href="{{ url_for('search_lawyers') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
