{% extends "base.html" %}

{% block title %}Upload Document{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">📤 Upload Legal Document</h1>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Select PDF File</label>
                    <input type="file" name="file" class="form-control" accept=".pdf" required>
                    <small class="text-muted">Only PDF files are supported</small>
                </div>
                <button type="submit" class="btn btn-primary">Upload & Summarize</button>
            </form>
        </div>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('client_documents') }}" class="btn btn-secondary">← Back to Documents</a>
    </div>
</div>
{% endblock %}
